<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Escáner de remitos · INCRO</title>
<style>
  :root{--azul:#004B96;--celeste:#14B4EB;--naranja:#F5A000;--verde:#1e9e4a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1520;color:#fff;font-family:Arial,Helvetica,sans-serif}
  header{background:var(--azul);padding:10px 14px;border-bottom:4px solid var(--celeste)}
  header b{font-size:17px} header small{display:block;opacity:.85;font-size:12px}
  #zona{position:relative;background:#000;width:100%;aspect-ratio:3/4;max-height:58vh;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  #guia{position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.28);transition:border-color .15s;pointer-events:none}
  #guia.ok{border-color:#3ddc6f}
  #flash{position:absolute;inset:0;background:#3ddc6f;opacity:0;pointer-events:none;transition:opacity .25s}
  #zoom{position:absolute;right:10px;bottom:10px;display:none;gap:6px}
  #zoom button{background:rgba(0,0,0,.6);color:#fff;border:1px solid #889;border-radius:18px;padding:7px 11px;font-size:15px;font-weight:bold}
  #zoom button.on{background:var(--naranja);color:#111;border-color:var(--naranja)}
  #estado{padding:10px 14px 2px;font-size:15px;min-height:40px}
  #estado.err{color:#ffb4b0}
  #diag{padding:0 14px 8px;font-size:11px;color:#8a97a8}
  #lista{padding:0 14px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#1d2b3d;border:1px solid #33475f;border-radius:20px;padding:8px 6px 8px 12px;font-size:16px;font-weight:bold;display:flex;align-items:center;gap:6px}
  .chip button{background:none;border:0;color:#ff9b96;font-size:18px;padding:0 6px}
  .bar{padding:12px 14px;display:flex;gap:10px}
  button.b{flex:1;border:0;border-radius:10px;padding:16px 10px;font-size:18px;font-weight:bold;color:#fff}
  #listo{background:var(--verde)} #listo:disabled{background:#3b4a3f;color:#9aa}
  #cancelar{background:#38485c;flex:0 0 34%}
  #linterna{background:#38485c;flex:0 0 auto;padding:16px 14px;display:none}
  #sinVentana{display:none;margin:12px 14px;padding:12px;border-radius:10px;background:#3d2f0a;border:1px solid var(--naranja);font-size:15px}
  #sinVentana b{font-size:20px;letter-spacing:.5px}
  #disparo{display:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.45);box-shadow:0 0 0 3px #0d1520 inset}
  #disparo:active{transform:translateX(-50%) scale(.92)}
  #disparo:disabled{opacity:.35}
  .ft{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid #33475f}
  .ft img{width:100%;height:100%;object-fit:cover;display:block}
  .ft button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(181,43,39,.92);color:#fff;font-size:15px;font-weight:bold;padding:0}
  body.fotos #guia{display:none}
  body.fotos #disparo{display:block}
</style>
</head>
<body>
<header><b id="hTit">Escáner de remitos · INCRO</b><small id="hSub">Acercá el celular hasta que el QR (abajo a la derecha del remito) llene el cuadro. Podés leer varios seguidos.</small></header>
<div id="zona"><video id="video" playsinline muted autoplay></video><div id="guia"></div><div id="flash"></div><button type="button" id="disparo" aria-label="Sacar foto"></button>
  <div id="zoom"><button type="button" data-z="1">1×</button><button type="button" data-z="2">2×</button><button type="button" data-z="3">3×</button></div></div>
<div id="estado">Abriendo la cámara…</div>
<div id="diag"></div>
<div id="lista"></div>
<div class="bar">
  <button class="b" id="cancelar" type="button">Cancelar</button>
  <button class="b" id="linterna" type="button">🔦</button>
  <button class="b" id="listo" type="button" disabled>Listo ›</button>
</div>
<div id="sinVentana"></div>
<script>
(function(){
  'use strict';
  var P=new URLSearchParams(location.search), FOTOS=P.get('modo')==='fotos';
  var MAXF=Math.max(1,Math.min(30,+P.get('max')||10)), PXF=Math.max(400,Math.min(2400,+P.get('px')||1024)), QF=Math.max(0.3,Math.min(0.95,+P.get('q')||0.6));
  var TIPO=FOTOS?'incro-fotos':'incro-qr', leidos=[], stream=null, track=null, detector=null, corriendo=false, ultimo={t:'',ts:0}, linternaOn=false, cuadros=0, motorUltimo='';
  var $=function(i){ return document.getElementById(i); };
  var video=$('video'), cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  var JSQR_URLS=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];

  // Mismo criterio que la app: ...numRemito=MK400200036756 -> 400200036756 ; o los últimos 10-14 dígitos
  function numeroDeQR(txt){ var t=String(txt||''), m=t.match(/numRemito=[A-Za-z]*(\d{6,})/i)||t.match(/(\d{10,14})\D*$/); return m?m[1]:''; }
  function avisar(msg,err){ var e=$('estado'); e.textContent=msg; e.className=err?'err':''; }
  function enviar(datos){
    try{ if(window.opener && !window.opener.closed){ datos.tipo=TIPO; window.opener.postMessage(datos,'*'); return true; } }catch(e){}
    return false;
  }
  function cargarJsQR(){
    if(window.jsQR) return Promise.resolve(true);
    return new Promise(function(res){ var i=0; (function prueba(){
      if(i>=JSQR_URLS.length) return res(false);
      var sc=document.createElement('script'); sc.src=JSQR_URLS[i++]; sc.onload=function(){ window.jsQR?res(true):prueba(); }; sc.onerror=prueba; document.head.appendChild(sc); })(); });
  }
  function pintar(){
    if(FOTOS){
      $('lista').innerHTML=leidos.map(function(u,i){ return '<span class="ft"><img src="'+u+'" alt=""><button type="button" data-i="'+i+'" aria-label="Borrar">✕</button></span>'; }).join('');
      $('listo').disabled=!leidos.length; $('listo').textContent=leidos.length?'Listo ('+leidos.length+') ›':'Listo ›';
      $('disparo').disabled=leidos.length>=MAXF;
      if(corriendo) avisar(leidos.length>=MAXF?'Llegaste al máximo de '+MAXF+' fotos. Tocá "Listo".':(leidos.length?leidos.length+' de '+MAXF+' fotos. Tocá el botón blanco para sacar otra, o "Listo".':'Tocá el botón blanco para cada foto (hasta '+MAXF+'). Después tocá "Listo".'));
      return;
    }
    $('lista').innerHTML=leidos.map(function(n,i){ return '<span class="chip">'+n+'<button type="button" data-i="'+i+'" aria-label="Quitar">✕</button></span>'; }).join('');
    $('listo').disabled=!leidos.length;
    $('listo').textContent=leidos.length?'Listo ('+leidos.length+') ›':'Listo ›';
  }
  $('lista').addEventListener('click',function(e){ var b=e.target.closest('button[data-i]'); if(!b) return; leidos.splice(+b.dataset.i,1); pintar(); });

  var actx=null;
  function pitido(f){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); var o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=f||1046; g.gain.value=0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.12); }catch(e){} }
  document.addEventListener('touchstart',function(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} },{once:true});
  function destello(){ var f=$('flash'); f.style.opacity=.45; $('guia').className='ok'; setTimeout(function(){ f.style.opacity=0; $('guia').className=''; },220); }

  function encontrado(txt){
    var ahora=Date.now();
    if(txt===ultimo.t && ahora-ultimo.ts<2500) return; // el mismo código sigue en cámara
    ultimo={t:txt,ts:ahora};
    var n=numeroDeQR(txt);
    if(!n){ avisar('Ese QR no es de un remito de Calipso.',true); pitido(330); return; }
    if(leidos.indexOf(n)>-1){ avisar('El remito '+n+' ya está en la lista.'); return; }
    leidos.push(n); pintar(); destello(); pitido(1046);
    try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
    avisar('✔ Remito '+n+' leído. Apuntá al siguiente o tocá "Listo".');
  }

  function sacarFoto(){
    if(!corriendo || leidos.length>=MAXF) return;
    var w=video.videoWidth, h=video.videoHeight; if(!w||!h) return;
    var k=Math.min(1,PXF/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext('2d').drawImage(video,0,0,c.width,c.height);
    leidos.push(c.toDataURL('image/jpeg',QF)); destello(); pitido(1500);
    try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
    pintar(); var l=$('lista'); l.scrollLeft=l.scrollWidth;
  }
  $('disparo').onclick=sacarFoto;

  // jsQR sobre una zona del cuadro: k=1 recorte central (lo que está dentro del marco, a resolución completa), k=0 cuadro entero reducido
  function leerJsQR(recorte){
    if(!window.jsQR) return '';
    var w=video.videoWidth, h=video.videoHeight; if(!w||!h) return '';
    var sx=0, sy=0, sw=w, sh=h;
    if(recorte){ var lado=Math.round(Math.min(w,h)*recorte); sx=Math.round((w-lado)/2); sy=Math.round((h-lado)/2); sw=sh=lado; }
    var k=Math.min(1,(recorte?800:960)/Math.max(sw,sh));
    cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);
    cx.drawImage(video,sx,sy,sw,sh,0,0,cv.width,cv.height);
    var r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:recorte?'attemptBoth':'dontInvert'});
    return r&&r.data?r.data:'';
  }
  function leerCuadro(){
    if(!corriendo) return;
    if(video.readyState<2 || !video.videoWidth){ return setTimeout(leerCuadro,150); }
    cuadros++;
    var p=detector ? detector.detect(video).then(function(c){ return c&&c[0]?c[0].rawValue:''; }).catch(function(){ return ''; }) : Promise.resolve('');
    p.then(function(txt){
      if(txt){ motorUltimo='nativo'; return txt; }
      var t=''; try{ t=leerJsQR(cuadros%2?0.8:0.5) || (cuadros%3===0 ? leerJsQR(0) : ''); }catch(e){}
      if(t) motorUltimo='jsQR';
      return t;
    }).then(function(txt){
      if(txt) encontrado(txt);
      if(cuadros%10===0) $('diag').textContent='Cámara '+video.videoWidth+'×'+video.videoHeight+' · lector '+(detector?'nativo + ':'')+(window.jsQR?'jsQR':'(cargando)')+' · '+cuadros+' cuadros analizados'+(motorUltimo?' · última lectura: '+motorUltimo:'');
      setTimeout(leerCuadro,90);
    });
  }

  function prepararZoom(cap){
    if(!cap || !cap.zoom || !(cap.zoom.max>1)) return;
    var z=$('zoom'); z.style.display='flex';
    Array.prototype.forEach.call(z.querySelectorAll('button'),function(b){ if(+b.dataset.z>cap.zoom.max) b.style.display='none'; });
    z.onclick=function(e){ var b=e.target.closest('button[data-z]'); if(!b) return;
      track.applyConstraints({advanced:[{zoom:Math.min(cap.zoom.max,+b.dataset.z)}]}).catch(function(){});
      Array.prototype.forEach.call(z.querySelectorAll('button'),function(x){ x.className=x===b?'on':''; }); };
    if(FOTOS){ z.querySelector('[data-z="1"]').className='on'; return; }
    if(cap.zoom.max>=2){ try{ track.applyConstraints({advanced:[{zoom:2}]}); z.querySelector('[data-z="2"]').className='on'; }catch(e){} }
    else z.querySelector('[data-z="1"]').className='on';
  }

  function iniciar(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      avisar('Este navegador no permite usar la cámara en vivo. Volvé a la app y usá "foto del QR".',true); enviar({error:'sin-camara'}); return;
    }
    var hayJs=FOTOS?Promise.resolve(true):cargarJsQR();
    var hayBD=Promise.resolve(false);
    try{ if('BarcodeDetector' in window) hayBD=(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():Promise.resolve(['qr_code'])).then(function(f){ if(f.indexOf('qr_code')>-1){ detector=new BarcodeDetector({formats:['qr_code']}); return true; } return false; }).catch(function(){ return false; }); }catch(e){}
    navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}})
      .then(function(s){
        stream=s; track=s.getVideoTracks()[0]; video.srcObject=s;
        var cap=null; try{ cap=track.getCapabilities&&track.getCapabilities(); }catch(e){}
        if(cap&&cap.torch) $('linterna').style.display='';
        if(cap&&cap.focusMode&&cap.focusMode.indexOf('continuous')>-1){ track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){}); }
        prepararZoom(cap);
        return video.play();
      })
      .then(function(){ return Promise.all([hayJs,hayBD]); })
      .then(function(r){
        if(!r[0] && !r[1]){ avisar('No se pudo cargar el lector de QR (¿sin señal?). Volvé a la app y usá "foto del QR".',true); return; }
        corriendo=true;
        if(FOTOS){ avisar('Tocá el botón blanco para cada foto. Después tocá "Listo".'); pintar(); return; }
        avisar('Acercá el QR del remito hasta que llene el cuadro.'); leerCuadro();
      })
      .catch(function(e){
        var neg=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
        avisar(neg?'No se dio permiso para usar la cámara. Habilitalo en el navegador o volvé a la app y usá "foto del QR".':'No se pudo abrir la cámara ('+(e&&e.name||e)+'). Volvé a la app y usá "foto del QR".',true);
        enviar({error:neg?'permiso':'camara'});
      });
  }
  function apagar(){ corriendo=false; try{ stream&&stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }

  $('linterna').onclick=function(){ if(!track) return; linternaOn=!linternaOn; track.applyConstraints({advanced:[{torch:linternaOn}]}).catch(function(){}); };
  $('cancelar').onclick=function(){ apagar(); enviar({numeros:[], cancelado:true}); window.close(); setTimeout(function(){ avisar('Podés cerrar esta pestaña y volver a la app.'); },300); };
  $('listo').onclick=function(){
    if(!leidos.length) return;
    apagar();
    if(enviar(FOTOS?{fotos:leidos.slice()}:{numeros:leidos.slice()})){ avisar('Enviando a la app…'); setTimeout(function(){ window.close(); },FOTOS?400:150); return; }
    var sv=$('sinVentana'); sv.style.display='block';
    if(FOTOS){ sv.innerHTML='No se pudo devolver las fotos a la app. Volvé a la app y usá <b style="font-size:15px">Subir de la galería</b>.'; avisar(''); return; }
    sv.innerHTML='No se pudo devolver a la app automáticamente. Escribí estos N° en la app:<br><b>'+leidos.join('<br>')+'</b>';
    avisar('');
  };
  window.addEventListener('pagehide',apagar);
  if(FOTOS){ document.body.className='fotos'; document.title='Fotos de la mercadería · INCRO'; $('hTit').textContent='Fotos de la mercadería · INCRO'; $('hSub').textContent='Sacá todas las fotos seguidas; borrá con ✕ las que no sirvan.'; $('lista').style.flexWrap='nowrap'; $('lista').style.overflowX='auto'; }
  pintar();
  enviar({hola:true});
  iniciar();
})();
</script>
</body>
</html>
